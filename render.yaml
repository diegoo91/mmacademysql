# Render Blueprint — MM Padel Academy API (backend in ./server).
# Deploy: Render dashboard → New → Blueprint → select this repo → fill the
# `sync: false` values (DATABASE_URL = Supabase pooler URL) → Apply.
services:
  - type: web
    name: mm-academy-api
    runtime: node
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: DB_ENABLED
        value: true
      - key: DB_CONNECTION_LIMIT
        value: 5
      - key: ALLOW_IMPORT_DB
        value: false
      - key: ACCESS_TOKEN_EXPIRES
        value: 1d
      - key: REFRESH_TOKEN_EXPIRES
        value: 30d
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: IMPORT_SECRET
        sync: false
