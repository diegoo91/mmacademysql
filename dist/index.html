    <script>
      (function() {
        var t = localStorage.getItem('mm_padel_theme') || 'dark';
        var themeClasses = ['theme-light','theme-ocean','theme-forest','theme-sunset','theme-royal','theme-contrast'];
        var cls = { light:'theme-light', ocean:'theme-ocean', forest:'theme-forest', sunset:'theme-sunset', royal:'theme-royal', contrast:'theme-contrast' };
        var isDark = t !== 'light';
        function apply(el) {
          if (!el) return;
          themeClasses.forEach(function(c) { el.classList.remove(c); });
          if (isDark) el.classList.add('dark'); else el.classList.remove('dark');
          if (cls[t]) el.classList.add(cls[t]);
        }
        apply(document.documentElement);
        if (document.body) apply(document.body);
      })();
    </script>
